name: Mobile web editor

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chrome-and-vm:
    runs-on: ubuntu-24.04
    # Retain a finite bound for the full Chrome/VM suite. WebKit's slow
    # OS dependency installation is avoided by the separate pinned-image job.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify and compose the current reviewed site
        run: |
          python tools/prepare_mobile_editor.py --archive build-artifacts/reviewed.zip --output build-artifacts/site --full-site --fetch
          python tools/promote_js_portal.py --site build-artifacts/site
          python tools/add_mobile_web.py --site build-artifacts/site
          if ! command -v bison >/dev/null; then sudo apt-get update && sudo apt-get install -y bison; fi
          python tools/prepare_p2_web_firmware.py --output build-artifacts/p2-web-firmware
          python tools/add_p2_web_installer.py --site build-artifacts/site --firmware build-artifacts/p2-web-firmware
      - name: Validate source, preserved desktop assets and browser contracts
        env:
          MOBILE_EDITOR_SOURCE: ${{ github.workspace }}/build-artifacts/site/js-preview/waveshare
          MOBILE_SITE: ${{ github.workspace }}/build-artifacts/site
        run: |
          python tools/validate.py
          node --test tests/mobile-browser.test.cjs
          node tests/js-preview-compile.test.cjs build-artifacts/site
          node tests/p2-usability-compile.test.cjs build-artifacts/site
      - name: Compile native SFC with the actual pinned JavaScript compiler
        run: node tools/test_sfc_js_compiler.cjs build-artifacts/site/js-preview/waveshare build-artifacts/sfc-js-compiler
      - name: Verify all three optional board asset packages
        run: |
          python tools/check_mobile_board_packages.py --source build-artifacts/ide-source --mobile-source build-artifacts/site/js-preview/waveshare --output build-artifacts/board-packages --fetch
      - name: Exercise actual mobile and desktop interfaces
        run: |
          python -m pip install playwright==1.64.1
          python tests/mobile_web_smoke.py --site build-artifacts/site --output build-artifacts/browser --browser /usr/bin/google-chrome
          python tests/js_portal_smoke.py --site build-artifacts/site --output build-artifacts/js-portal --browser /usr/bin/google-chrome
          python tests/p2_installer_browser.py --site build-artifacts/site --output build-artifacts/p2-installer --browser /usr/bin/google-chrome
          python tests/mobile_touch_smoke.py --editor build-artifacts/site/mobile --output build-artifacts/touch --browser /usr/bin/google-chrome
          python tests/mobile_startup_smoke.py --editor build-artifacts/site/mobile --output build-artifacts/startup --browser /usr/bin/google-chrome
          python tests/mobile_usability_smoke.py --editor build-artifacts/site/mobile --output build-artifacts/usability --browser /usr/bin/google-chrome
          python tests/mobile_board_smoke.py --packages build-artifacts/board-packages --output build-artifacts/board-browser --browser /usr/bin/google-chrome
          python tests/sfc_js_browser.py --site build-artifacts/site --output build-artifacts/sfc-js-browser --browser /usr/bin/google-chrome
      - name: Execute browser programming against real SmallVM
        run: |
          git init build-artifacts/upstream
          git -C build-artifacts/upstream remote add origin https://codeberg.org/MicroBlocks/smallvm.git
          git -C build-artifacts/upstream fetch --depth=1 origin 2071df569623ba9cdcd6f8106b61796e047df38b
          python -m pip install -r linux/arm64/bridge-requirements.txt
          python tools/prepare_mobile_vm_test.py --linux-source . --upstream build-artifacts/upstream --output build-artifacts/vm --sanitize --test
          python tools/build_sfc_native_fixture.py
          python tools/test_sfc_branches_vm.py --binary build-artifacts/vm/smallvm --host build-artifacts/sfc-native/host --reports build-artifacts/sfc-js-compiler --output build-artifacts/sfc-js-branches-vm.json --compiler javascript
          python tools/test_sfc_native_vm.py --binary build-artifacts/vm/smallvm --compiled build-artifacts/sfc-js-compiler/serial-legacy.json --output build-artifacts/sfc-js-serial-vm.json --compiler javascript
          python tests/mobile_vm_browser.py --linux-source . --binary build-artifacts/vm/smallvm --editor build-artifacts/board-packages/rlcd/http-root --output build-artifacts/real-vm --browser /usr/bin/google-chrome
          python tools/test_sfc_js_browser_vm.py --binary build-artifacts/vm/smallvm --editor build-artifacts/board-packages/rlcd/http-root --output build-artifacts/sfc-js-browser-vm --browser /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-web-evidence
          path: |
            build-artifacts/browser
            build-artifacts/js-portal
            build-artifacts/p2-installer
            build-artifacts/p2-web-firmware/installer-build.json
            build-artifacts/p2-web-firmware/*.log
            build-artifacts/touch
            build-artifacts/startup
            build-artifacts/usability
            build-artifacts/real-vm
            build-artifacts/board-browser
            build-artifacts/vm/build-manifest.json
            build-artifacts/board-packages/summary.json
            build-artifacts/sfc-js-compiler
            build-artifacts/sfc-js-browser
            build-artifacts/sfc-js-branches-vm.json
            build-artifacts/sfc-js-serial-vm.json
            build-artifacts/sfc-js-browser-vm
      - name: Upload reviewed site for isolated WebKit acceptance
        uses: actions/upload-artifact@v4
        with:
          name: mobile-web-reviewed-site
          path: build-artifacts/site
          # Only the generated, reviewed static site; preserve its .nojekyll.
          include-hidden-files: true

  webkit:
    needs: chrome-and-vm
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      # Official 1.64.1 Noble image: browsers and OS dependencies preinstalled.
      image: mcr.microsoft.com/playwright/python:v1.64.1-noble@sha256:330d401ae23c905896a0c26c66c36fc971b621519e7b11b435a8328d7bf6e031
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: mobile-web-reviewed-site
          path: build-artifacts/site
      - name: Install the matching Playwright Python package
        run: python -m pip install playwright==1.64.1
      - name: Recheck the transferred reviewed source and asset hashes
        env:
          MOBILE_EDITOR_SOURCE: ${{ github.workspace }}/build-artifacts/site/js-preview/waveshare
          MOBILE_SITE: ${{ github.workspace }}/build-artifacts/site
        run: python -m unittest discover -s tests -p test_mobile_web.py -v
      - name: Exercise the unchanged WebKit mobile and desktop interface checks
        run: python tests/mobile_web_smoke.py --site build-artifacts/site --output build-artifacts/webkit --engine webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-webkit-evidence
          path: build-artifacts/webkit

  # Preserve the original required check name; neither constituent may fail
  # or be skipped while this acceptance check reports success.
  browser-and-assets:
    if: always()
    needs: [chrome-and-vm, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both complete browser acceptance jobs
        env:
          CHROME_VM_RESULT: ${{ needs.chrome-and-vm.result }}
          WEBKIT_RESULT: ${{ needs.webkit.result }}
        run: |
          python - <<'PY'
          # BEGIN_CHECKED_MOBILE_JOBS
          import os
          results = {key: os.environ[key] for key in ('CHROME_VM_RESULT', 'WEBKIT_RESULT')}
          if any(value != 'success' for value in results.values()):
              raise SystemExit('Required mobile acceptance incomplete: ' + repr(results))
          print('Chrome/VM and WebKit acceptance both passed')
          # END_CHECKED_MOBILE_JOBS
          PY

name: Offline validation

on:
  push:
  pull_request:

jobs:
  manifest-and-source-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate capability manifest and source contracts
        run: python3 tools/validate.py
      - name: Cross-check RTC calendar against Python datetime
        run: python3 tools/test_calendar.py
      - name: Compile and run portable Wi-Fi setup and journal fixtures
        run: python3 tools/test_network_setup.py --native-compiler cc
      - name: Compile and run common Zephyr flash backend fixtures
        run: python3 tools/test_network_setup.py --native-compiler cc --flash-backend
      - name: Compile and run XRP transport ownership fixtures
        run: python3 tools/test_network_setup.py --native-compiler cc --xrp-transport
      - name: Explain validation boundary
        run: echo 'This workflow does NOT build Zephyr or test physical hardware.'
      - name: Check portable result ownership, bounds and reuse under sanitizers
        run: python3 tools/test_p4_results.py
      - name: Check portable neural tensor bounds under sanitizers
        run: python3 tools/test_p4_nn_contract.py
      - name: Check bounded JSON, clock, steps and RAM storage under sanitizers
        run: |
          python3 tools/test_json_service.py
          python3 tools/test_automation.py
          python3 tools/test_storage.py
          python3 tools/test_storage_dispatch.py
      - name: Check file manager and native RAM wire contracts
        env:
          MB_FILES_HOST: ${{ github.workspace }}/build-artifacts/storage-dispatch/wire-host
        run: node --test tests/device_files.test.js tests/device_files_wire.test.js

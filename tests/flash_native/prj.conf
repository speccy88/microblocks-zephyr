CONFIG_ZTEST=y
CONFIG_ASSERT=y
CONFIG_ASAN=y
CONFIG_ZTEST_STACK_SIZE=8192
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FS_LITTLEFS_NUM_FILES=1
CONFIG_FS_LITTLEFS_NUM_DIRS=1
CONFIG_FS_LITTLEFS_CACHE_SIZE=256
# Dedicated single-file cache: default 256+32 is too small for native64 heap metadata.
# This is a bounded FS cache pool, not the general malloc/system heap.
CONFIG_FS_LITTLEFS_FC_HEAP_SIZE=512
CONFIG_FS_LITTLEFS_LOOKAHEAD_SIZE=32
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=8192
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y

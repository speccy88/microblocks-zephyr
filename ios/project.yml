name: MicroBlocks
options:
  bundleIdPrefix: fun.microblocks.experimental
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  MicroBlocks:
    type: application
    platform: iOS
    sources:
      - path: MicroBlocks
        excludes: [Editor]
      - path: MicroBlocks/Editor
        type: folder
        buildPhase: resources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: MicroBlocks
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocalNetworkUsageDescription: Connect to your MicroBlocks board on the same Wi-Fi network to upload programs and read results.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fun.microblocks.experimental.iphone
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: 1
  MicroBlocksTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: MicroBlocks
  MicroBlocksUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: MicroBlocks
schemes:
  MicroBlocks:
    build:
      targets:
        MicroBlocks: all
    test:
      targets: [MicroBlocksTests, MicroBlocksUITests]

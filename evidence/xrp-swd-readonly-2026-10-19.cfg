# Read-only XRP debug-port identification. No CPU targets or flash banks.
source [find interface/cmsis-dap.cfg]
adapter serial B2047FF29EB03C7E
cmsis-dap backend usb_bulk
transport select swd
adapter speed 100
reset_config none
gdb_port disabled
tcl_port disabled
telnet_port disabled
swd newdap xrp cpu -expected-id 0x00040927
dap create xrp.dap -adiv6 -chain-position xrp.cpu
init
echo [format "READONLY_DPIDR=0x%08x" [xrp.dap dpreg 0]]
echo [format "READONLY_DP_CTRL_STAT=0x%08x" [xrp.dap dpreg 4]]
echo [format "READONLY_CM0_ROM_ENTRY=0x%08x" [xrp.dap apreg 0 0]]
echo [format "READONLY_CM1_ROM_ENTRY=0x%08x" [xrp.dap apreg 0 4]]
echo [format "READONLY_RP_AP_IDR=0x%08x" [xrp.dap apreg 0x80000 0xdfc]]
echo [format "READONLY_CM0_AP_IDR=0x%08x" [xrp.dap apreg 0x2000 0xdfc]]
echo [format "READONLY_CM1_AP_IDR=0x%08x" [xrp.dap apreg 0x4000 0xdfc]]
echo "READONLY_IDENTIFICATION_COMPLETE"
shutdown

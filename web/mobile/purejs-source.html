		<!-- Start IDE when page is loaded -->
		<script>
			var world, mbEditor;
			window.onload = function () {
				var FPS = 60,
					lastTime = 0,
					lastStep = 0,

				// Morphic UI loop
				loop = (timestamp) => {
					requestAnimationFrame(loop);
					if (timestamp - lastStep >= 250) { // four times a second, as GP steps its scripter
						lastStep = timestamp;
						MB_editor.step();
					}
					if (timestamp - lastTime < 1000 / FPS) {
						return;
					}
					world.doOneCycle();
					lastTime = Math.max(
						lastTime + 1000 / FPS,
						timestamp - 1000 / FPS
					);
				};

				setTimeout(async () => {
					// Hack: Wait a bit before starting to let everything finish loading...
					MorphicPreferences.isFlat = true;
					world = new WorldMorph(document.getElementById('canvas'), false);
					IDE.init();
					mbEditor = MB_editor.open(world);
					IDE.resize(); // place the world canvas over the workspace slot
					// Started first, so the IDE keeps running while a link's project asks a question.
					requestAnimationFrame(loop);
					// Before a link's project, so the work a crash left behind is offered first.
					if (MB_editor.autosave) await MB_editor.autosave.start();
					try {
						// A link the page was opened with.
						await MB_editor.importFromURL(location.href);
					} catch (error) {
						// The IDE still runs: a link nobody can open is not a dead page.
						console.error('Could not open this link:', error);
					}
				}, 500);
			};
		</script>

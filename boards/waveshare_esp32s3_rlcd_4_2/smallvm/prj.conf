CONFIG_ARDUINO_API=y
CONFIG_ARDUINO_ENTRY=n
CONFIG_ARDUINO_API_SERIAL_BUFFER_SIZE=4096
CONFIG_CPP=y
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_SENSOR=y
CONFIG_RTC=y
CONFIG_ADC=y
CONFIG_DISPLAY=y
CONFIG_INPUT=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=16384
# SmallVM owns USB Serial/JTAG binary transport exclusively.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_LOG=n
CONFIG_SHELL=n
CONFIG_BOOT_BANNER=n

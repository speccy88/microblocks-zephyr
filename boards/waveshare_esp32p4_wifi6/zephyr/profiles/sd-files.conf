# Explicit opt-in. No automatic operation, overwrite, format or mkfs fallback.
CONFIG_P4_SD_READONLY=n
CONFIG_P4_SD_FILES=y
CONFIG_FILE_SYSTEM=y
CONFIG_DISK_DRIVERS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_READ_ONLY=n
CONFIG_FS_FATFS_MOUNT_MKFS=n
CONFIG_FS_FATFS_MKFS=n
CONFIG_FILE_SYSTEM_MKFS=n
# Direct FatFs FIL lives on the checked internal worker stack; VFS file slots
# are not needed. The read-only metadata probe retains one directory slot.
CONFIG_FS_FATFS_NUM_FILES=0
CONFIG_FS_FATFS_NUM_DIRS=1
CONFIG_FS_FATFS_LFN=n
CONFIG_FS_FATFS_WINDOW_ALIGNMENT=64
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_DYNAMIC_THREAD_POOL_SIZE=0
CONFIG_DYNAMIC_THREAD_PREFER_ALLOC=y

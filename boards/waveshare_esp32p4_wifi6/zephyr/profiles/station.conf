# Explicit station only; no AP interface, routing, Bluetooth or auto-config.
CONFIG_ESP_HOSTED_MCU=y
CONFIG_ESP_HOSTED_MCU_SDIO=y
CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_WIFI_USAGE_MODE_STA=y
CONFIG_WIFI_ESP_HOSTED_MCU_AP_STA_MODE=n
CONFIG_WIFI_ESP_HOSTED_MCU_DEFER_STATION=y
CONFIG_P4_HOSTED=y
CONFIG_BT=n
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_SERVER=n
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_MAX_CONTEXTS=10
CONFIG_NET_MAX_CONN=10
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=4096
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=4096
CONFIG_NET_BUF_DATA_SIZE=512
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=24
CONFIG_NET_PKT_RX_COUNT=12
CONFIG_NET_PKT_TX_COUNT=12
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_SERVER_VERSION_2=n
CONFIG_HTTP_SERVER_MAX_CLIENTS=4
CONFIG_HTTP_SERVER_CLIENT_BUFFER_SIZE=2048
CONFIG_HTTP_SERVER_CAPTURE_HEADERS=y
CONFIG_HTTP_SERVER_MAX_HEADER_LEN=128
CONFIG_HTTP_SERVER_MAX_URL_LENGTH=128
CONFIG_HTTP_SERVER_CAPTURE_HEADER_COUNT=4
CONFIG_HTTP_SERVER_CAPTURE_HEADER_BUFFER_SIZE=256
CONFIG_HTTP_SERVER_WEBSOCKET=y
CONFIG_HTTP_SERVER_STACK_SIZE=6144
CONFIG_WEBSOCKET_MAX_CONTEXTS=2
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_NVS_DATA_CRC=y
CONFIG_CRC=y
CONFIG_HEAP_MEM_POOL_SIZE=32768

# Opt-in native MicroBlocks SD detection/listing. No writes/format APIs.
CONFIG_P4_SD_READONLY=y
CONFIG_FILE_SYSTEM=y
CONFIG_DISK_DRIVERS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_READ_ONLY=y
CONFIG_FS_FATFS_MOUNT_MKFS=n
CONFIG_FS_FATFS_MKFS=n
CONFIG_FILE_SYSTEM_MKFS=n
CONFIG_FS_FATFS_NUM_FILES=0
CONFIG_FS_FATFS_NUM_DIRS=1
CONFIG_FS_FATFS_LFN=n
CONFIG_FS_FATFS_WINDOW_ALIGNMENT=64
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_DYNAMIC_THREAD_POOL_SIZE=0
CONFIG_DYNAMIC_THREAD_PREFER_ALLOC=y
# Keep the proven station SDIO timeouts/retry limits. The worker checks its
# cooperative deadline between filesystem calls; it never aborts a DMA owner.

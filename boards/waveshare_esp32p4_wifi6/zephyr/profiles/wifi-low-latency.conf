# Explicit powered-board performance policy; volatile, verified, once per boot.
CONFIG_P4_WIFI_LOW_LATENCY=y
# This SDIO C6 reports pending RX in a register without asserting DAT1.
# Bound ACK/request polling to 5ms; default profiles remain at 20ms.
# More idle P4 wakeups/status reads; use deliberately on a powered board.
CONFIG_ESP_HOSTED_MCU_EVENT_TASK_POLL_MS=5
